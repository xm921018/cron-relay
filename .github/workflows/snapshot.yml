name: snapshot

# 目标任务快照补采。
#   2026-10-23 新增：北京 10:00 把全池重查一次创作者工作台，POST /api/snap（slice=am）。
#   2026-10-27 改造：主触发改为「relay 播放轮跑完自动采」，并把采集拆成多片并发。
#   2026-10-28 加门闩：主路径早于北京 09:10 结束时，等到 09:10 再采。
#     原因：网易工作台当日数据 9 点过后才结算刷新，采早了整池都是旧值
#     （10-28 实锤：relay 08:33 结束即采，361 条快照全是 9 点前的旧数据，事后只能整班重跑）。
#     规则 = 采集时刻取 max(relay 结束时刻, 门闩)。只在主路径 workflow_run 生效，
#     10:00 / 12:00 兜底不受影响。等待放在 plan 作业里（仅 1 个 runner 空转，分片睡醒后正常并发）。
#   2026-10-29 门闩 09:10 → 10:05：09:10 仍未结算完 —— 实测当天 358 个可比号里 261 个（73%）
#     650 进度一格没动（平时只有 12~24%），而同一天播放量 rpc30 有 73% 的号在涨、中位 +21
#     （和前两天的 62% 同档），650 均值只涨了 +0.77 个点（昨天 +4.50、前天 +6.10）。
#     即「播放照进、650 没入账」，纯采集时刻早于网易结算。10 点后一般已完成，故推到 10:05，
#     留 5 分钟缓冲，避免正好卡在网易刷新的那一瞬间。等待改成循环，不会再被单次 sleep 截断。
#     （兜底链路 10:00 / 12:00 仍按「今天已采过就跳过」去重，当天不会因此多采一次。）
#   2026-10-30 两条规则改为【所有触发路径】生效（原来只查 workflow_run 主路径，
#     CF cron 10:10 的 workflow_dispatch 兜底把两个检查全绕过了）：
#     ① 等 relay：每 10 分钟轮询 run.yml 状态，直到没有任何在跑/排队的轮次才采。
#       实锤：10-30 relay 跑到 10:48，10:10 的 CF cron 采集就把全池采了一遍，
#       最后两片约 12 个号「播到一半」被采，快照停在播放前的值，12:00 兜底又被
#       already_collected_today 挡掉 —— 这批号当天永远是 0 增长。
#     ② 门闩 10:05 → 11:40：结算完成点实测在 11:30~12:00（10:05 采 → 25% 号零增长；
#       10-29 的 11:46 采 → 仅 2%）。采集时刻 = max(relay 结束, 11:40)，relay 拖过 11:40
#       就继续等 relay —— 门闩只是下限，不赌结算一定完成。
#     等待总上限 5h50m（plan 作业 6h 默认超时内），超时 busy=1 整片跳过交给兜底：
#     宁可不采，也不采「一半在播」的脏数据。
#
# 为什么主路径要从「定时」改成「relay 跑完触发」：
#   控制台「今日650进度」要的是「全池同一时刻、同一结算状态」的数据。凌晨播放轮是边播边采，
#   各片时间戳横跨好几个小时（10-27 实测最早 04:00、最晚 09:21），一部分号采在网易结算前、
#   一部分采在结算后，同一列数据混了两种口径，日环比就会看着怪。
#   而号码池涨到 400+ 之后 relay 会跑过 10:00，那时 20 个并发名额被 relay 占满，
#   定时派发出去的采集要么排队、要么采到「一半刚播完、一半还在播」。改成 relay 结束即触发，
#   既拿到统一时刻，又正好用上 relay 刚释放出来的并发名额。
#
# 为什么拆成多片：原来单个 runner 用 6 线程连查全池，等于「一个出口 IP 打 372 个号」，
# 是全项目最集中的查询动作。拆片后每片只查十几个号、各自独立 runner / 独立出口 IP。

on:
  # 主路径：relay 全部片跑完 → GitHub 立刻触发本工作流（延迟几秒，无需轮询、不依赖 CF cron）。
  # relay 以失败结束也会触发（采集无害，读侧 rpc30 大者胜保证幂等）。
  workflow_run:
    workflows: ["relay"]
    types: [completed]
  # 兜底一：CF 原生 cron（北京 10:00）→ worker scheduled → workflow_dispatch 派发本工作流。
  # 用途：relay 卡住不结束、或 GitHub 侧没触发 workflow_run 时救场。
  # 若发现今天主路径已经采过，snapshot.py 会自己跳过（already_collected_today）。
  # 手动补采入口（2026-10-29）：勾 force 忽略「今天已采过」去重，用于当天重采。
  # 不勾（CF cron 派发、或直接点 Run workflow）行为与以前完全一致。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「今天已采过」去重，强制补采一次'
        type: boolean
        default: false
  # 兜底二：GitHub 原生 schedule（北京 12:00）。免费档实测会延迟 1~5 小时，只当第三重保险。
  schedule:
    - cron: '0 4 * * *'

jobs:
  plan:
    # 按号池实际人数算片数：号数涨、片数自动涨，不写死。
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ns: ${{ steps.plan.outputs.ns }}
      busy: ${{ steps.plan.outputs.busy }}
    permissions:
      actions: read
    steps:
      - name: plan snap slices
        id: plan
        env:
          WORKER_URL: 'https://xx1031.xyz'
          ASSIGN_PASS: ${{ secrets.ASSIGN_PASS }}
          NB_PASS: ${{ secrets.NB_PASS }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACCOUNTS_PER_SLICE: '12'   # 每片约 12 个号；号数涨时片数涨，每片负担保持恒定
          MAX_SLICES: '40'           # 硬上限：账号并发只有 20，40 片 = 两波跑完；再多也只是排队
        run: |
          python3 - <<'EOF'
          import json, math, os, time, urllib.parse, urllib.request, datetime

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")


          def bj_day():
              return (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).date().isoformat()


          def pool_size():
              url = (os.environ.get("WORKER_URL") or "").rstrip("/")
              pw = os.environ.get("ASSIGN_PASS") or os.environ.get("NB_PASS") or ""
              if not (url and pw):
                  return 0
              try:
                  q = urllib.parse.urlencode({"pass": pw, "day": bj_day()})
                  req = urllib.request.Request(url + "/api/pool_stat?" + q,
                                               headers={"User-Agent": UA, "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode())
                  if d.get("ok") and d.get("m_pool"):
                      return int(d["m_pool"])
                  print("pool_stat 返回异常:", str(d)[:160])
              except Exception as e:
                  print("pool_stat 失败:", e)
              return 0


          def relay_running():
              """查 run.yml（relay）是否还有在排队/在跑的轮次。
              返回 True=忙 / False=空闲；查询失败返回 None（调用方小步重试，不当作空闲）。"""
              tok, repo = os.environ.get("GH_API_TOKEN"), os.environ.get("REPO")
              if not (tok and repo):
                  print("缺 GH_API_TOKEN/REPO，无法查 relay 状态")
                  return None
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/repos/%s/actions/workflows/run.yml/runs?per_page=10" % repo,
                      headers={"Authorization": "Bearer " + tok,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "snap-plan"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode())
                  for x in (d.get("workflow_runs") or []):
                      if x.get("status") in ("queued", "in_progress", "waiting", "pending"):
                          print("还有 relay 在跑/排队（#%s %s）" % (x.get("id"), x.get("status")))
                          return True
                  return False
              except Exception as e:
                  print("查 relay 状态失败（稍后重试）:", e)
                  return None


          # 2026-10-30 改造：等 relay 全部跑完 + 门闩，两条规则对所有触发路径生效
          # （原来 relay_busy 只查 workflow_run 主路径，CF cron 的 workflow_dispatch 兜底全绕过；
          #   门闩同理只挂在 EVENT_NAME == workflow_run 分支里。当天 10:10 的 CF cron 采集
          #   撞上 relay 尾巴（跑到 10:48），12 个号播到一半被采且当天无法再更新。）
          # 采集时刻 = max(relay 全部结束, 北京 11:40 门闩)。总上限 5h50m，超时 busy=1 整片跳过、
          # 交给 12:00 兜底（兜底同样先等 relay）—— 宁可不采，也不采脏数据。
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          spent = 0
          busy = 0

          # ① 等 relay：每 10 分钟查一次，直到空闲；查询失败小步（2 分钟）重试
          while True:
              running = relay_running()
              if running is False:
                  print("relay 已全部结束（北京 %s），进入门闩判断。" % now.strftime("%H:%M"))
                  break
              if spent >= 21000:
                  print("::warning::等 relay 结束已等 %d 分钟仍未结束，本轮不采，交给兜底。" % (spent // 60))
                  busy = 1
                  break
              wait = min(600 if running else 120, 21000 - spent)
              time.sleep(wait)
              spent += wait
              now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)

          # ② 门闩：等到北京 11:40（650 有效播放结算完成点之后；实测 11:46 采的零增长仅 2%）
          if not busy:
              gate = now.replace(hour=11, minute=40, second=0, microsecond=0)
              if now >= gate:
                  print("已过 11:40 门闩（北京 %s），立即采集。" % now.strftime("%H:%M"))
              else:
                  print("relay 虽已结束（北京 %s），但早于 11:40 门闩（650 结算未完成），等门闩到点再采。"
                        % now.strftime("%H:%M"))
              while now < gate and spent < 21000:
                  wait = max(1, min(int((gate - now).total_seconds()), 900, 21000 - spent))
                  time.sleep(wait)
                  spent += wait
                  now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
              if now >= gate:
                  print("门闩到点（北京 %s），开始分片采集。" % now.strftime("%H:%M"))
              else:
                  print("::warning::等待总时长已达上限仍未到 11:40，本轮不采，交给兜底。")
                  busy = 1

          per = max(1, int(os.environ.get("ACCOUNTS_PER_SLICE", "12") or 12))
          hi = max(1, int(os.environ.get("MAX_SLICES", "40") or 40))
          n = pool_size()
          ns = max(1, min(hi, math.ceil(n / per))) if n else 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("ns=%d\n" % ns)
              f.write("busy=%s\n" % ("1" if busy else "0"))
              f.write("matrix=%s\n" % json.dumps({"slice": list(range(ns))}))
          print("pool_size=%d ns=%d busy=%s" % (n, ns, busy))
          EOF

  snap:
    needs: plan
    # 仅在等待超时（relay 一直不结束/门闩没等到）时整片跳过，交给 12:00 的兜底。
    # 正常情况下 plan 已等到「relay 全部结束 + 过 11:40 门闩」才放行。
    if: needs.plan.outputs.busy != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      actions: read     # 兜底路径要去查今天主路径采过没有（去重）
      contents: read
    env:
      WORKER_URL: 'https://xx1031.xyz'
      SNAP_URL: 'https://xx1031.xyz'
      POOL_TAG: 'hz'
      SNAP_JOB: ${{ matrix.slice }}
      SNAP_JOBS: ${{ needs.plan.outputs.ns }}
      SNAP_BATCH: '20'   # 每片只有十几个号，攒 20 条就发，单片失败损失更小
      TRIGGER_EVENT: ${{ github.event_name }}
      SNAP_FORCE: ${{ inputs.force && '1' || '' }}
      GH_REPO_SLUG: ${{ github.repository }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSIGN_PASS: ${{ secrets.ASSIGN_PASS }}
      NB_PASS: ${{ secrets.NB_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pycryptodome requests
      - name: snapshot workbench slice ${{ matrix.slice }}/${{ needs.plan.outputs.ns }}
        run: python snapshot.py
