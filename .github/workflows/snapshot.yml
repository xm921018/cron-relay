name: snapshot

# 2026-10-23 新增：目标任务快照上午 10 点补采。
# 凌晨播放轮（02:35-05:38）顺带采的工作台数据落在目标任务结算前，
# 控制台日环比会出现「明明涨了却显示 0」的假象。北京 10:00 全池重查一次，
# POST /api/snap（slice=am）补采；控制台读侧同号同天 rpc30 大者胜，自动覆盖凌晨数据。
on:
  schedule:
    # 2026-10-24：主触发已改到 Cloudflare 原生 cron（北京 10:00 准点，worker scheduled →
    # workflow_dispatch）。GitHub 免费档的 schedule 实测整体延迟 1~5 小时（relay 计划 22:23
    # 实际 02:25 跑），snapshot 上线两天甚至 0 次自动运行。这里保留北京 12:00 一班兜底：
    # 万一 CF 侧失效，至少还有第二次机会。两班跑同一个 workflow，重复采集由快照写入的
    # 「同号同天 rpc30 大者胜」自动去重，不会写坏数据。
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKER_URL: 'https://xx1031.xyz'
      SNAP_URL: 'https://xx1031.xyz'
      POOL_TAG: 'hz'
      ASSIGN_PASS: ${{ secrets.ASSIGN_PASS }}
      NB_PASS: ${{ secrets.NB_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pycryptodome requests
      - name: snapshot workbench at 10:00
        run: python snapshot.py
