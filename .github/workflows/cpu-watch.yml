name: cpu-watch

# Worker CPU 预警（2026-10-22 新增）。
# 每天北京时间 10:10 查一次 cron-relay / dingzhi 两个 Worker 最近 24 小时的 CPU 分位，
# 中位请求 CPU 超过阈值（默认 9.5ms，免费版上限 10ms）就给号主邮箱发一封提醒，
# 免得等哪天整站 1102 了才发现。
# 手动触发可勾选 force：不看阈值强制发一封，用来验证通道。

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制发信（通道自测）"
        required: false
        default: "false"

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check worker cpu
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          CPU_THRESH_MS: '9.5'
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python cpu_watch.py --force
          else
            python cpu_watch.py
          fi
