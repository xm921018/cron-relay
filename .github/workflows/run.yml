name: relay

on:
  schedule:
    - cron: '23 14 * * *'      # UTC 14:23 ≈ 北京 22:23，错峰
  workflow_dispatch: {}

jobs:
  brush:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 1, 2, 3]     # 4 个并行 job = 最多 4 个不同出口 IP
    env:
      NS: 4
      SLICE: ${{ matrix.slice }}
      NB_POOL_1: ${{ secrets.NB_POOL_1 }}
      NB_POOL_2: ${{ secrets.NB_POOL_2 }}
      NB_POOL_3: ${{ secrets.NB_POOL_3 }}
      NB_POOL_4: ${{ secrets.NB_POOL_4 }}
      NB_POOL_5: ${{ secrets.NB_POOL_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pycryptodome requests
      - name: stagger start
        run: sleep $((RANDOM % 240 + 60))   # 错开各片启动，避免同刻批量特征
      - name: run slice
        run: python run.py
      - name: upload diag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-slice-${{ matrix.slice }}
          path: diag_logs/
          if-no-files-found: ignore
