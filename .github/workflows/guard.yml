name: relay-guard

# 兜底保障：relay（run.yml）每天必须跑一次。
# GitHub 定时任务只会"延迟"（实测 0.5~4.5h），但偶发被跳过或失败；
# 本工作流在每天 UTC 21:30（北京 05:30）检查当天（UTC 日）relay 是否已成功/在跑，
# 没有则手动 dispatch 补发一次。正常情况下它什么也不做。
#
# 注意：Actions list-runs 的 created 日期过滤参数实测不可靠（会返回未过滤结果），
# 因此这里拉最近 30 条在本地按 created_at 过滤，不依赖服务端过滤。

on:
  schedule:
    - cron: '30 21 * * *'     # UTC 21:30 ≈ 北京 05:30
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: check & re-dispatch relay if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          H = {"Authorization": "Bearer " + TOK,
               "Accept": "application/vnd.github+json",
               "User-Agent": "relay-guard"}

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30))

          def post(url):
              req = urllib.request.Request(url, data=b'{"ref":"main"}',
                                           headers={**H, "Content-Type": "application/json"},
                                           method="POST")
              return urllib.request.urlopen(req, timeout=30).status

          utc_today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          # 拉最近 30 条（relay 每天至多 1-2 条，30 条覆盖两周以上），本地按日期过滤
          d = get(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=30")
          runs = [r for r in d.get("workflow_runs", [])
                  if r.get("path") == ".github/workflows/run.yml"
                  and str(r.get("created_at", ""))[:10] == utc_today]
          succeeded = any(r.get("conclusion") == "success" for r in runs)
          running = any(r.get("status") in ("queued", "in_progress", "waiting", "pending") for r in runs)

          if succeeded:
              print(f"今日 relay 已成功（今日记录 {len(runs)} 条），无需补发")
          elif running:
              print(f"今日 relay 正在运行，无需补发")
          else:
              print(f"今日 relay 未成功（今日记录 {len(runs)} 条），补发 dispatch")
              code = post(f"https://api.github.com/repos/{REPO}/actions/workflows/run.yml/dispatches")
              print("dispatch HTTP", code)
          EOF
