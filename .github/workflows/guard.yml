name: relay-guard

# 兜底保障：relay（run.yml）每天必须跑一次。
# GitHub 定时任务只会"延迟"（实测 0.5~4.5h），但偶发被跳过或失败；
# 本工作流在每天 UTC 21:30（北京 05:30）检查当天（UTC 日）relay 是否已成功/在跑，
# 没有则手动 dispatch 补发一次。正常情况下它什么也不做。

on:
  schedule:
    - cron: '30 21 * * *'     # UTC 21:30 ≈ 北京 05:30
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: check & re-dispatch relay if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timedelta

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          H = {"Authorization": "Bearer " + TOK,
               "Accept": "application/vnd.github+json",
               "User-Agent": "relay-guard"}

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30))

          def post(url):
              req = urllib.request.Request(url, data=b'{"ref":"main"}',
                                           headers={**H, "Content-Type": "application/json"},
                                           method="POST")
              return urllib.request.urlopen(req, timeout=30).status

          # 按北京时间算"今天"：relay 定时在北京 22:23 前后（UTC 14:23）触发，
          # 属于同一个 UTC 日；北京时间已跨天时（>08:00 UTC）以 UTC 日为准即可覆盖
          utc_today = datetime.utcnow().strftime("%Y-%m-%d")
          d = get(f"https://api.github.com/repos/{REPO}/actions/runs?created=>={utc_today}&per_page=50")
          runs = [r for r in d.get("workflow_runs", []) if r.get("path") == ".github/workflows/run.yml"]
          succeeded = any(r.get("conclusion") == "success" for r in runs)
          running = any(r.get("status") in ("queued", "in_progress", "waiting", "pending") for r in runs)

          if succeeded:
              print(f"今日 relay 已成功（{len(runs)} 条记录），无需补发")
          elif running:
              print(f"今日 relay 正在运行，无需补发")
          else:
              n_fail = sum(1 for r in runs if r.get("conclusion") not in ("success", None))
              print(f"今日 relay 未成功（记录 {len(runs)} 条，其中失败 {n_fail}），补发 dispatch")
              code = post(f"https://api.github.com/repos/{REPO}/actions/workflows/run.yml/dispatches")
              print("dispatch HTTP", code)
          EOF
