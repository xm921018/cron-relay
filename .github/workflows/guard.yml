name: relay-guard

# 兜底保障：relay（run.yml）每天必须跑一次。
# GitHub 定时任务只会"延迟"（实测 0.5~7.7h），但偶发被跳过或失败；
# 本工作流每天 UTC 23:30（北京 07:30）检查最近 28 小时内 relay 是否已成功/在跑，
# 没有则手动 dispatch 补发一次。正常情况下它什么也不做。
#
# 历史教训（2026-10-13 修复）：
# 1. 原版本按"当天 UTC 日期"过滤 run，但 relay 计划在 UTC 14:23，被 GitHub 延迟到
#    22:00+ UTC 才创建是常态（实测最晚 22:09 UTC）。若 guard 在 21:30 UTC 检查，
#    当晚的 relay 还没被创建 → 误判"今天没跑"→ 补发 → 一晚双跑、播放翻倍。
#    故 guard 改到 UTC 23:30（晚于实测最晚创建时间），并改用滚动窗口。
# 2. Actions list-runs 的 created 日期过滤参数实测不可靠（会返回未过滤结果），
#    因此这里拉最近 30 条在本地按 created_at 时间戳过滤，不依赖服务端过滤。
# 3. 滚动窗口取 28h：relay 约 24h 一班，窗口 > 24h+最大延迟(约9h)可容忍延迟不误补，
#    同时真丢一整天（上次成功运行已 ~33h 前）时能补上。

on:
  schedule:
    - cron: '30 23 * * *'     # UTC 23:30 ≈ 北京 07:30
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: check & re-dispatch relay if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          H = {"Authorization": "Bearer " + TOK,
               "Accept": "application/vnd.github+json",
               "User-Agent": "relay-guard"}

          WINDOW_HOURS = 28

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30))

          def post(url):
              req = urllib.request.Request(url, data=b'{"ref":"main"}',
                                           headers={**H, "Content-Type": "application/json"},
                                           method="POST")
              return urllib.request.urlopen(req, timeout=30).status

          def parse_ts(s):
              return datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)

          now = datetime.now(timezone.utc)
          window_start = now - timedelta(hours=WINDOW_HOURS)
          # 拉最近 30 条（relay 每天至多 1-2 条，30 条覆盖两周以上），本地按时间戳过滤
          d = get(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=30")
          recent = []
          for r in d.get("workflow_runs", []):
              if r.get("path") != ".github/workflows/run.yml":
                  continue
              try:
                  created = parse_ts(r.get("created_at", ""))
              except Exception:
                  continue
              if created >= window_start:
                  recent.append((created, r))
          recent.sort(key=lambda x: x[0])
          succeeded = any(r.get("conclusion") == "success" for _, r in recent)
          running = any(r.get("status") in ("queued", "in_progress", "waiting", "pending")
                        for _, r in recent)
          print(f"窗口 {WINDOW_HOURS}h 内 relay 记录 {len(recent)} 条"
                f"（最近一条 {recent[-1][0].strftime('%Y-%m-%d %H:%M UTC') if recent else '无'}）"
                f" 成功={succeeded} 在跑={running}")

          if succeeded or running:
              print("最近 relay 已成功/在跑，无需补发")
          else:
              print("窗口内无 relay 成功/在跑记录，补发 dispatch")
              code = post(f"https://api.github.com/repos/{REPO}/actions/workflows/run.yml/dispatches")
              print("dispatch HTTP", code)
          EOF
