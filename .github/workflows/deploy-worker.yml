name: deploy-worker

# 自动部署 Cloudflare Worker：只要 push 到 main 且改动了 worker/ 目录（或本工作流自身），
# 就用 CF API 把 worker/worker.js 上传上线，无需再手动部署。
# 部署采用 ES Module 格式（export default { fetch }）—— 因为要绑 D1，service worker 格式
# 不支持 D1 绑定（会报 100329）。上传字段名必须是 main_module 对应的 worker.js，
# 且 Content-Type 为 application/javascript+module。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-10-26：部署前拦一道「模板字符串里写反引号 / ${」的检查。
      # 踩过的坑：CONSOLE_HTML 是反引号模板字符串，在其中一段前端注释里写了反引号，
      # 模板被提前结束，后面半截被当成 worker 真实代码求值 → CF 报
      # 「Uncaught ReferenceError: a is not defined」。注释里写也不行。
      # 顺手把「模板内单反斜杠正则」也标成警告（\d 会被吃成 d，静默失效）。
      - name: check template string safety
        run: python3 worker/check_template.py

      - name: deploy worker to cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: c60450bfb7f2c2becfd744ba2508a4f2
        run: |
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-10-01","bindings":[{"name":"POOL","type":"kv_namespace","namespace_id":"12aac9fba6a04b8fb19ee88ffac7fc7a"},{"name":"DB","type":"d1","id":"54f742fc-5f56-4723-a7a0-a832953d38c7"},{"name":"GH_OWNER","type":"plain_text","text":"xm921018"},{"name":"GH_REPO","type":"plain_text","text":"cron-relay"}]}' > /tmp/worker_meta.json
          curl -sS -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata=@/tmp/worker_meta.json;type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/cron-relay" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('DEPLOY_OK' if d.get('success') else ('DEPLOY_FAIL '+json.dumps(d))); print('modified_on', (d.get('result') or {}).get('modified_on')); sys.exit(0 if d.get('success') else 1)"

      # 2026-10-24：worker 里的 scheduled 入口负责北京 10:10 触发 snap650 补采。
      # GitHub 自带 schedule 在本账号会整体延迟 1~5 小时（relay 22:23→次日 02:25，
      # snap650 上线两天 0 次自动运行），所以改由 CF 原生 cron 准点触发。
      # 这一步是幂等的：每次部署后重设一次，避免上传脚本时把定时器弄丢却无人察觉。
      # 2026-10-29：10:00 → 10:10。snapshot.yml 主路径的「10:05 门闩」是实测结算完成时间，
      # 兜底排在主路径之前等于每次都赶在结算前采到半截数据（慢歌还在涨）。
      - name: ensure cron trigger (10:10 Beijing)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: c60450bfb7f2c2becfd744ba2508a4f2
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '[{"cron":"10 2 * * *"}]' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/cron-relay/schedules" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=(d.get('result') or {}).get('schedules') or []; print('CRON_OK' if d.get('success') else ('CRON_FAIL '+json.dumps(d))); print('cron =', [x.get('cron') for x in r]); sys.exit(0 if d.get('success') else 1)"
