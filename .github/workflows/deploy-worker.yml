name: deploy-worker

# 自动部署 Cloudflare Worker：只要 push 到 main 且改动了 worker/ 目录（或本工作流自身），
# 就用 CF API 把 worker/worker.js 上传上线，无需再手动部署。
# 部署采用 ES Module 格式（export default { fetch }）—— 因为要绑 D1，service worker 格式
# 不支持 D1 绑定（会报 100329）。上传字段名必须是 main_module 对应的 worker.js，
# 且 Content-Type 为 application/javascript+module。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deploy worker to cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: c60450bfb7f2c2becfd744ba2508a4f2
        run: |
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-10-01","bindings":[{"name":"POOL","type":"kv_namespace","namespace_id":"12aac9fba6a04b8fb19ee88ffac7fc7a"},{"name":"DB","type":"d1","id":"54f742fc-5f56-4723-a7a0-a832953d38c7"},{"name":"GH_OWNER","type":"plain_text","text":"xm921018"},{"name":"GH_REPO","type":"plain_text","text":"cron-relay"}]}' > /tmp/worker_meta.json
          curl -sS -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata=@/tmp/worker_meta.json;type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/cron-relay" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('DEPLOY_OK' if d.get('success') else ('DEPLOY_FAIL '+json.dumps(d))); print('modified_on', (d.get('result') or {}).get('modified_on')); sys.exit(0 if d.get('success') else 1)"
